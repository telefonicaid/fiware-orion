name: Sonar

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  TEST_IMAGE_NAME: telefonicaiot/fiware-orion:ci
  # Same gcovr version in all jobs, so intermediate JSON reports can be merged
  GCOVR_VERSION: "8.3"
  GCOVR_FILTERS: "--filter 'src/' --exclude '.*parseArgs.*' --exclude '.*logMsg.*'"

jobs:
  unit-coverage:
    name: Unit tests coverage
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          docker run --network host --rm -e REPO_ACCESS_TOKEN=$REPO_ACCESS_TOKEN -v $(pwd):/opt/fiware-orion \
            ${{ env.TEST_IMAGE_NAME }} build -miqts unit

      - name: Generate coverage report
        if: always()
        run: |
          docker run --rm -v $(pwd):/opt/fiware-orion --entrypoint /bin/bash ${{ env.TEST_IMAGE_NAME }} -c "
            . /opt/ft_env/bin/activate &&
            pip install -q gcovr==${{ env.GCOVR_VERSION }} &&
            cd /opt/fiware-orion &&
            gcovr -r . -j 4 ${{ env.GCOVR_FILTERS }} --json -o coverage-unit.json BUILD_UNIT
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.json

  functional-coverage:
    name: Functional tests coverage - ${{ matrix.batch.name }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        batch:
          - { name: "batch 1 - cache", FT_FROM_IX: 0,   FT_TO_IX: 300,  CB_NO_CACHE: ""  }
          - { name: "batch 2 - cache", FT_FROM_IX: 301, FT_TO_IX: 600,  CB_NO_CACHE: ""  }
          - { name: "batch 3 - cache", FT_FROM_IX: 601, FT_TO_IX: 900,  CB_NO_CACHE: ""  }
          - { name: "batch 4 - cache", FT_FROM_IX: 901, FT_TO_IX: 1200, CB_NO_CACHE: ""  }
          - { name: "batch 5 - cache", FT_FROM_IX: 1201,FT_TO_IX: "",   CB_NO_CACHE: ""  }
          - { name: "batch 1 - no cache", FT_FROM_IX: 0,   FT_TO_IX: 300,  CB_NO_CACHE: "ON" }
          - { name: "batch 2 - no cache", FT_FROM_IX: 301, FT_TO_IX: 600,  CB_NO_CACHE: "ON" }
          - { name: "batch 3 - no cache", FT_FROM_IX: 601, FT_TO_IX: 900,  CB_NO_CACHE: "ON" }
          - { name: "batch 4 - no cache", FT_FROM_IX: 901, FT_TO_IX: 1200, CB_NO_CACHE: "ON" }
          - { name: "batch 5 - no cache", FT_FROM_IX: 1201,FT_TO_IX: "",   CB_NO_CACHE: "ON" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Failing tests should not prevent the coverage report from being generated
      - name: Run functional tests
        continue-on-error: true
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          FT_FROM_IX: ${{ matrix.batch.FT_FROM_IX }}
          FT_TO_IX:   ${{ matrix.batch.FT_TO_IX }}
          CB_NO_CACHE: ${{ matrix.batch.CB_NO_CACHE }}
          COVERAGE: "True"
          TEST_IMAGE_NAME: ${{ env.TEST_IMAGE_NAME }}
        run: |
          docker compose \
            --project-name sonar-functional-${{ github.run_id }}-${{ strategy.job-index }} \
            -f ./ci/deb/docker-compose-ci.yml -f ./ci/deb/docker-compose-ci.functional.yml \
            --project-directory . \
            up  --build --abort-on-container-exit --exit-code-from tests \
            --attach tests \
            --no-log-prefix

      - name: Generate coverage report
        run: |
          docker run --rm -v $(pwd):/opt/fiware-orion --entrypoint /bin/bash ${{ env.TEST_IMAGE_NAME }} -c "
            . /opt/ft_env/bin/activate &&
            pip install -q gcovr==${{ env.GCOVR_VERSION }} &&
            cd /opt/fiware-orion &&
            gcovr -r . -j 4 ${{ env.GCOVR_FILTERS }} --json -o coverage-functional-${{ strategy.job-index }}.json BUILD_FUNCTIONAL
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-functional-${{ strategy.job-index }}
          path: coverage-functional-${{ strategy.job-index }}.json

  sonar:
    name: Build and analyze
    runs-on: ubuntu-22.04
    needs: [unit-coverage, functional-coverage]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      # Merge unit and functional coverage into a single Cobertura report
      - name: Merge coverage reports
        run: |
          ls -l coverage-*.json
          docker run --rm -v $(pwd):/opt/fiware-orion --entrypoint /bin/bash ${{ env.TEST_IMAGE_NAME }} -c "
            . /opt/ft_env/bin/activate &&
            pip install -q gcovr==${{ env.GCOVR_VERSION }} &&
            cd /opt/fiware-orion &&
            gcovr -r . --add-tracefile 'coverage-*.json' --xml -o coverage.xml --print-summary &&
            sed -i 's#/opt/fiware-orion/\?##g' coverage.xml
          "

      - name: Run cppcheck
        run: |
          docker run --rm -v $(pwd):/opt/fiware-orion --entrypoint /bin/bash ${{ env.TEST_IMAGE_NAME }} -c "
            apt-get -y -q update &&
            apt-get -y -q install cppcheck &&
            cd /opt/fiware-orion &&
            cppcheck --xml --enable=all -I src/lib/ -i src/lib/parseArgs -i src/lib/logMsg src/ 2> cppcheck-result.xml &&
            sed -i 's#/opt/fiware-orion/##g' cppcheck-result.xml
          "

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # We do not recommend to use this in a pull request. Prefer using pull request
      # decoration instead.
      # - uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
